<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>News | Fenerbahçe Marl</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }


    /* HEADER */

    header {
      background: #071c4a;
      color: white;
      padding: 18px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .club-name {
      font-size: 25px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    nav a:hover {
      color: #ffd800;
    }


    /* KOPFBEREICH */

    .news-hero {
      background: #071c4a;
      color: white;
      padding: 80px 25px;
      text-align: center;
      border-top: 4px solid #ffd800;
    }

    .news-hero h1 {
      font-size: 50px;
      margin-bottom: 12px;
    }

    .news-hero p {
      color: #ddd;
      font-size: 18px;
    }


    /* NEWS */

    .news-section {
      max-width: 1300px;
      margin: auto;
      padding: 70px 25px;
    }

    .section-title {
      font-size: 34px;
      color: #071c4a;
      margin-bottom: 10px;
    }

    .yellow-line {
      width: 60px;
      height: 5px;
      background: #ffd800;
      margin-bottom: 40px;
    }


    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }


    .news-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }


    .news-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }


    .news-content {
      padding: 22px;
    }


    .news-date {
      display: inline-block;
      background: #ffd800;
      color: #071c4a;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 14px;
    }


    .news-card h2 {
      color: #071c4a;
      font-size: 21px;
      margin-bottom: 12px;
      line-height: 1.3;
    }


    .news-card p {
      color: #555;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 18px;
    }


    .read-more {
      color: #071c4a;
      font-weight: bold;
      text-decoration: none;
    }

    .read-more:hover {
      color: #d4b600;
    }


    /* LEER / LADEN */

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #777;
      font-size: 18px;
    }


    /* FOOTER */

    footer {
      background: #071c4a;
      color: white;
      text-align: center;
      padding: 35px 20px;
      margin-top: 50px;
    }


    /* HANDY */

    @media(max-width: 900px) {

      header {
        flex-direction: column;
        gap: 15px;
      }

      nav {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .news-hero h1 {
        font-size: 38px;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="club-name">
    Fenerbahçe Marl
  </div>

  <nav>

    <a href="index.html">
      Startseite
    </a>

    <a href="mannschaften.html">
      Mannschaften
    </a>

    <a href="news.html">
      News
    </a>

    <a href="index.html#sponsoren">
      Sponsoren
    </a>

    <a href="index.html#vorstand">
      Vorstand
    </a>

    <a href="index.html#kontakt">
      Kontakt
    </a>

  </nav>

</header>



<section class="news-hero">

  <h1>Aktuelle News</h1>

  <p>
    Neuigkeiten rund um Fenerbahçe Marl
  </p>

</section>



<section class="news-section">

  <h2 class="section-title">
    Vereinsnews
  </h2>

  <div class="yellow-line"></div>


  <div class="news-grid" id="newsContainer">

    <div class="loading">
      News werden geladen...
    </div>

  </div>

</section>



<footer>

  © 2026 Fenerbahçe Marl – Alle Rechte vorbehalten

</footer>


</body>
</html>
