<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>News | Fenerbahçe Marl</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }


    /* HEADER */

    header {
  background: #071c4a;
  color: white;
  padding: 18px 7%;
  display: flex;
  align-items: center;
  position: relative;
}

.club-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.club-logo {
  width: 60px;
  height: 60px;
  object-fit: contain;
  display: block;
}

.club-logo-link {
  display: flex;
  align-items: center;
  text-decoration: none;
}

.main-nav {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 30px;
}

.main-nav a {
  color: white;
  text-decoration: none;
  font-weight: 600;
  white-space: nowrap;
}

.main-nav a:hover {
  color: #ffd800;
}

    .main-nav a {
  position: relative;
  padding-bottom: 8px;
}

.main-nav a.active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 30px;
  height: 3px;
  background: #ffd800;
  border-radius: 3px;
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 18px;
}

.instagram-link,
.vorstand-login-link {
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-decoration: none;
  font-weight: 600;
}

.instagram-link svg,
.vorstand-login-link svg {
  width: 25px;
  height: 25px;
  display: block;
  transition: transform 0.2s ease, color 0.2s ease;
}

.instagram-link:hover svg,
.vorstand-login-link:hover svg {
  transform: scale(1.12);
  color: #ffd800;
}

    /* PROFIL MENÜ */

.profile-menu {
  position: relative;
}

.profile-button {
  background: transparent;
  border: none;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.profile-button svg {
  width: 27px;
  height: 27px;
  display: block;
  transition: transform 0.2s ease, color 0.2s ease;
}

.profile-button:hover svg {
  transform: scale(1.12);
  color: #ffd800;
}

.profile-dropdown {
  position: absolute;
  top: 42px;
  right: 0;
  width: 190px;
  background: white;
  border-radius: 8px;
  box-shadow: 0 8px 25px rgba(0,0,0,.18);
  overflow: hidden;
  display: none;
  z-index: 9999;
}

.profile-dropdown.open {
  display: block;
}

.profile-dropdown a,
.profile-dropdown button {
  width: 100%;
  display: block;
  padding: 13px 16px;
  background: white;
  border: none;
  color: #071c4a;
  text-align: left;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.profile-dropdown a:hover,
.profile-dropdown button:hover {
  background: #f5f5f5;
}

#logoutMenuItem {
  color: #c62828;
  border-top: 1px solid #eee;
}

 /* KOPFBEREICH */

    .news-hero {
      background: #071c4a;
      color: white;
      padding: 80px 25px;
      text-align: center;
      border-top: 4px solid #ffd800;
    }

    .news-hero h1 {
      font-size: 50px;
      margin-bottom: 12px;
    }

    .news-hero p {
      color: #ddd;
      font-size: 18px;
    }


    /* NEWS */

    .news-section {
  max-width: 1450px;
  margin: auto;
  padding: 70px 25px;
}

.section-title {
  font-size: 34px;
  color: #071c4a;
  margin-bottom: 10px;
}

.yellow-line {
  width: 60px;
  height: 5px;
  background: #ffd800;
  margin-bottom: 40px;
}

.news-grid {
  display: flex;
  flex-direction: column;
  gap: 3px;

  /* weiter nach links */
  margin-left: -120px;

  /* mehr Platz nach rechts */
  width: calc(100% + 240px);
}

.news-card {
  width: 100%;
  background: white;
  display: grid;

  /* Bild behält ungefähr seine jetzige Größe,
     zusätzliche Breite geht an die Textseite */
  grid-template-columns: 725px 1fr;

  min-height: 350px;
  border-radius: 0;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}

.news-card img {
  width: 100%;
  height: 350px;

  object-fit: cover;
  display: block;
}

.news-content {
  padding: 12px 55px 40px 55px;

  display: flex;
  flex-direction: column;

  /* Inhalt beginnt jetzt ganz oben */
  justify-content: flex-start;
  align-items: flex-start;
}

.news-date {
  display: inline-block;

  /* GELBEN HINTERGRUND ENTFERNT */
  background: transparent;

  color: #071c4a;

  padding: 0;

  /* DATUM GRÖSSER */
  font-size: 16px;
  font-weight: bold;

  margin-top: 0;
  margin-bottom: 22px;
}

.news-card h2 {
  color: #071c4a;
  font-size: 29px;

  margin-bottom: 18px;
  line-height: 1.3;
}

.news-card p {
  color: #555;

  font-size: 16px;
  line-height: 1.8;

  margin: 0;
}

    .read-more {
      color: #071c4a;
      font-weight: bold;
      text-decoration: none;
    }

    .read-more:hover {
      color: #d4b600;
    }


    /* LEER / LADEN */

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #777;
      font-size: 18px;
    }


    /* FOOTER */

    footer {
      background: #071c4a;
      color: white;
      text-align: center;
      padding: 35px 20px;
      margin-top: 50px;
    }


    /* HANDY */

    @media(max-width: 900px) {

  header {
    flex-direction: column;
    gap: 15px;
  }

  nav {
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .news-card {
    grid-template-columns: 1fr;
  }

  .news-card img {
    min-height: 240px;
    height: 240px;
  }

  .news-content {
    padding: 28px 22px;
  }

  .news-card h2 {
    font-size: 22px;
  }

  .news-hero h1 {
    font-size: 38px;
  }
}

  </style>

</head>


<body>


<header>

  <div class="club-brand">

  <a href="index.html" class="club-logo-link">
    <img
      src="logo.png"
      alt="Fenerbahçe Marl Logo"
      class="club-logo"
    >
  </a>

</div>

  <nav class="main-nav">
    <a href="index.html">Startseite</a>
    <a href="mannschaften.html">Mannschaften</a>
    <a href="news.html" class="active">News</a>
    <a href="sponsoren.html">Sponsoren</a>
    <a href="vorstand.html">Vorstand</a>
    <a href="kontakt.html">Kontakt</a>
  </nav>

  <div class="header-right">

    <a href="https://www.instagram.com/fbm.ev/"
       class="instagram-link"
       target="_blank"
       rel="noopener noreferrer"
       title="Instagram">

      <svg viewBox="0 0 24 24">
        <rect
          x="3"
          y="3"
          width="18"
          height="18"
          rx="5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        />

        <circle
          cx="12"
          cy="12"
          r="4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        />

        <circle
          cx="17.5"
          cy="6.5"
          r="1"
          fill="currentColor"
        />
      </svg>

    </a>

    <div class="profile-menu">

  <button
    type="button"
    class="profile-button"
    id="profileButton"
    title="Vorstand"
  >

    <svg viewBox="0 0 24 24" aria-hidden="true">

      <circle
        cx="12"
        cy="12"
        r="10"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      />

      <circle
        cx="12"
        cy="8"
        r="3.2"
        fill="currentColor"
      />

      <path
        d="M6.5 19v-2.2c0-3 2.4-5.3 5.5-5.3s5.5 2.3 5.5 5.3V19"
        fill="currentColor"
      />

    </svg>

  </button>


  <div
    class="profile-dropdown"
    id="profileDropdown"
  >

    <a
      href="vorstand-login.html"
      id="loginMenuItem"
    >
      Anmelden
    </a>

    <a
      href="vorstand-dashboard.html"
      id="newsMenuItem"
    >
      News veröffentlichen
    </a>

    <button
      type="button"
      id="logoutMenuItem"
    >
      Abmelden
    </button>

  </div>

</div>

  </div>

</header>

<section class="news-hero">

  <h1>Aktuelle News</h1>

  <p>
    Neuigkeiten rund um Fenerbahçe Marl
  </p>

</section>



<section class="news-section">

  <h2 class="section-title">
    Vereinsnews
  </h2>

  <div class="yellow-line"></div>


  <div class="news-grid" id="newsContainer">

    <div class="loading">
      News werden geladen...
    </div>

  </div>

</section>



<footer>

  © 2026 Fenerbahçe Marl – Alle Rechte vorbehalten

</footer>

  <script>

const API_URL = "https://fenerbahce-marl-backend.onrender.com";

const newsContainer = document.getElementById("newsContainer");


async function loadNews() {

  try {

    const response = await fetch(
      API_URL + "/api/news"
    );

    const news = await response.json();


    if (!response.ok) {
      throw new Error("News konnten nicht geladen werden.");
    }


    if (news.length === 0) {

      newsContainer.innerHTML = `
        <div class="loading">
          Aktuell sind keine News vorhanden.
        </div>
      `;

      return;
    }


    newsContainer.innerHTML = "";


    news.forEach(item => {

      const date = new Date(item.created_at)
        .toLocaleDateString(
          "de-DE",
          {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }
        );


      const card = document.createElement("article");

      card.className = "news-card";


      card.innerHTML = `

        ${
          item.image_url
  ? `
      <img
        src="${item.image_url}"
        alt="${escapeHTML(item.title)}"
        style="
          object-position:
          ${item.image_position_x ?? 50}%
          ${item.image_position_y ?? 50}%;
        "
      >
    `
  : ""
        }

        <div class="news-content">

          <span class="news-date">
            ${date}
          </span>

          <h2>
            ${escapeHTML(item.title)}
          </h2>

          <p>
            ${escapeHTML(item.text)}
          </p>

        </div>
      `;


      newsContainer.appendChild(card);

    });


  } catch (error) {

  console.error(error);

  newsContainer.innerHTML = `
    <div class="loading">
      News werden geladen...
    </div>
  `;

  setTimeout(() => {
    loadNews();
  }, 5000);

}

}


function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


loadNews();

    const profileButton =
  document.getElementById("profileButton");

const profileDropdown =
  document.getElementById("profileDropdown");

const loginMenuItem =
  document.getElementById("loginMenuItem");

const newsMenuItem =
  document.getElementById("newsMenuItem");

const logoutMenuItem =
  document.getElementById("logoutMenuItem");


profileButton.addEventListener("click", function(event) {

  event.stopPropagation();

  profileDropdown.classList.toggle("open");

});


document.addEventListener("click", function() {

  profileDropdown.classList.remove("open");

});


profileDropdown.addEventListener("click", function(event) {

  event.stopPropagation();

});


async function updateProfileMenu() {

  const token =
    sessionStorage.getItem("vorstandToken");


  if (!token) {

    loginMenuItem.style.display = "block";
    newsMenuItem.style.display = "none";
    logoutMenuItem.style.display = "none";

    return;
  }


  try {

    const response = await fetch(
      API_URL + "/api/auth/check",
      {
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );


    if (!response.ok) {

      sessionStorage.removeItem("vorstandToken");

      loginMenuItem.style.display = "block";
      newsMenuItem.style.display = "none";
      logoutMenuItem.style.display = "none";

      return;
    }


    loginMenuItem.style.display = "none";
    newsMenuItem.style.display = "block";
    logoutMenuItem.style.display = "block";


  } catch (error) {

    console.error(error);

  }

}


logoutMenuItem.addEventListener("click", function() {

  sessionStorage.removeItem("vorstandToken");

  profileDropdown.classList.remove("open");

  updateProfileMenu();

});


updateProfileMenu();
</script>


</body>
</html>
