<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/logo.png">

  <title>News | Fenerbahçe Marl</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }


    /* HEADER */

    header {
  background: #071c4a;
  color: white;
  padding: 18px 7%;
  display: flex;
  align-items: center;
  position: relative;
}

.club-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.club-logo {
  width: 60px;
  height: 60px;
  object-fit: contain;
  display: block;
}

.club-logo-link {
  display: flex;
  align-items: center;
  text-decoration: none;
}

.main-nav {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 30px;
}

.main-nav a {
  color: white;
  text-decoration: none;
  font-weight: 600;
  white-space: nowrap;
}

.main-nav a:hover {
  color: #ffd800;
}

    .main-nav a {
  position: relative;
  padding-bottom: 8px;
}

.main-nav a.active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 30px;
  height: 3px;
  background: #ffd800;
  border-radius: 3px;
}

    /* MANNSCHAFTEN DROPDOWN */

.team-menu {
  position: relative;
}

.team-menu-link {
  display: flex;
  align-items: center;
  gap: 7px;
}

.menu-arrow {
  font-size: 9px;
  transition: transform 0.2s ease;
}

.team-menu:hover .menu-arrow {
  transform: rotate(180deg);
}

.team-submenu {
  position: absolute;
  top: calc(100% + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(-5px);
  width: 205px;
  background: #071c4a;
  border-top: 3px solid #ffd800;
  border-radius: 0 0 8px 8px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition:
    opacity 0.2s ease,
    transform 0.2s ease,
    visibility 0.2s ease;
  z-index: 5000;
}

.team-submenu::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -15px;
  height: 15px;
}

.team-menu:hover .team-submenu {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}

.team-submenu a {
  display: block;
  padding: 14px 18px;
  color: white;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.team-submenu a:last-child {
  border-bottom: none;
}

.team-submenu a:hover {
  background: #173d7e;
  color: #ffd800;
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 18px;
}

.instagram-link,
.vorstand-login-link {
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-decoration: none;
  font-weight: 600;
}

.instagram-link svg,
.vorstand-login-link svg {
  width: 25px;
  height: 25px;
  display: block;
  transition: transform 0.2s ease, color 0.2s ease;
}

.instagram-link:hover svg,
.vorstand-login-link:hover svg {
  transform: scale(1.12);
  color: #ffd800;
}

    /* PROFIL MENÜ */

.profile-menu {
  position: relative;
}

.profile-button {
  background: transparent;
  border: none;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.profile-button svg {
  width: 27px;
  height: 27px;
  display: block;
  transition: transform 0.2s ease, color 0.2s ease;
}

.profile-button:hover svg {
  transform: scale(1.12);
  color: #ffd800;
}

.profile-dropdown {
  position: absolute;
  top: 42px;
  right: 0;
  width: 190px;
  background: white;
  border-radius: 8px;
  box-shadow: 0 8px 25px rgba(0,0,0,.18);
  overflow: hidden;
  display: none;
  z-index: 9999;
}

.profile-dropdown.open {
  display: block;
}

.profile-dropdown a,
.profile-dropdown button {
  width: 100%;
  display: block;
  padding: 13px 16px;
  background: white;
  border: none;
  color: #071c4a;
  text-align: left;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.profile-dropdown a:hover,
.profile-dropdown button:hover {
  background: #f5f5f5;
}

#logoutMenuItem {
  color: #c62828;
  border-top: 1px solid #eee;
}

    /* NEWS */

    .news-section {
  max-width: 1450px;
  margin: auto;
  padding: 70px 25px;
}

.section-title {
  font-size: 34px;
  color: #071c4a;
  margin-bottom: 10px;
}

.yellow-line {
  width: 60px;
  height: 5px;
  background: #ffd800;
  margin-bottom: 40px;
}

.news-grid {
  display: flex;
  flex-direction: column;
  gap: 28px;

  /* weiter nach links */
  margin-left: -120px;

  /* mehr Platz nach rechts */
  width: calc(100% + 240px);
}

.news-card {
  width: 100%;
  background: white;
  display: grid;

  /* Bild behält ungefähr seine jetzige Größe,
     zusätzliche Breite geht an die Textseite */
  grid-template-columns: 725px 1fr;

  min-height: 350px;
  border-radius: 0;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}

.news-card img {
  width: 100%;
  height: 350px;

  object-fit: cover;
  display: block;
}

.news-content {
  padding: 12px 55px 40px 55px;

  display: flex;
  flex-direction: column;

  /* Inhalt beginnt jetzt ganz oben */
  justify-content: flex-start;
  align-items: flex-start;
}

.news-date {
  display: inline-block;

  /* GELBEN HINTERGRUND ENTFERNT */
  background: transparent;

  color: #071c4a;

  padding: 0;

  /* DATUM GRÖSSER */
  font-size: 16px;
  font-weight: bold;

  margin-top: 0;
  margin-bottom: 22px;
}

.news-card h2 {
  color: #071c4a;
  font-size: 29px;

  margin-bottom: 18px;
  line-height: 1.3;
}

.news-card p {
  color: #555;

  font-size: 16px;
  line-height: 1.8;

  margin: 0;
}

    .read-more {
      color: #071c4a;
      font-weight: bold;
      text-decoration: none;
    }

    .read-more:hover {
      color: #d4b600;
    }


    /* LEER / LADEN */

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #777;
      font-size: 18px;
    }


    /* FOOTER */

footer {
  background: #071c4a;
  color: white;
  min-height: 105px;
  padding: 14px 7%;
  position: relative;
  display: flex;
  align-items: center;
  margin-top: 50px;
}

.footer-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.footer-logo {
  width: 65px;
  height: 65px;
  object-fit: contain;
  display: block;
}

.footer-links {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}

.footer-link {
  color: rgba(255, 255, 255, 0.65);
  text-decoration: none;
  font-family: "Montserrat", sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.3px;
  padding-bottom: 3px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.45);
}

.footer-link:hover {
  color: #ffd800;
  border-color: #ffd800;
}

.footer-copy {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: "Montserrat", sans-serif;
  font-size: 10px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.55);
}

    .mobile-menu-button {
  display: none;
  width: 36px;
  height: 32px;
  background: transparent;
  border: none;
  cursor: pointer;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  padding: 4px;
}

.mobile-menu-button span {
  display: block;
  width: 100%;
  height: 3px;
  background: white;
  border-radius: 5px;
}

@media(max-width: 700px) {

  footer {
    flex-direction: column;
    justify-content: center;
    gap: 15px;
  }

  .footer-copy {
    position: static;
    transform: none;
  }

}


    /* HANDY */

@media(max-width: 900px) {

  header {
    padding: 12px 18px;
    flex-direction: row;
    gap: 0;
    min-height: 74px;
    z-index: 5000;
  }

  .club-logo {
    width: 50px;
    height: 50px;
  }

  .club-brand {
    order: 1;
  }

  .header-right {
    order: 2;
    margin-left: auto;
    gap: 14px;
  }

  .mobile-menu-button {
    display: flex;
    order: 3;
    margin-left: 15px;
  }

  .main-nav {
    display: none;
    position: absolute;
    top: 74px;
    left: 0;
    transform: none;
    width: 100%;
    background: #071c4a;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 10px 18px 20px;
    border-top: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 10px 20px rgba(0,0,0,.18);
  }

  .main-nav.open {
    display: flex;
  }

  .main-nav > a,
  .team-menu-link {
    width: 100%;
    padding: 14px 5px;
    font-size: 15px;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }

  .main-nav a.active::after {
    display: none;
  }

  .team-menu {
    width: 100%;
  }

  .team-menu-link {
    justify-content: space-between;
  }

  .team-submenu {
    display: none;
    position: static;
    left: auto;
    width: 100%;
    transform: none;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    box-shadow: none;
    border: none;
    border-radius: 0;
    background: #0b2a65;
    margin: 0;
  }

  .team-menu.mobile-open .team-submenu,
  .team-menu:hover .team-submenu {
    display: block;
    position: static;
    left: auto;
    transform: none;
    width: 100%;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .team-menu.mobile-open .menu-arrow {
    transform: rotate(180deg);
  }

  .team-submenu a {
    display: block;
    width: 100%;
    padding: 14px 20px;
    font-size: 14px;
    color: white;
    text-align: left;
  }


  /* NEWS AUF HANDY */

  .news-section {
    padding: 45px 18px;
  }

  .section-title {
    font-size: 30px;
  }

  .yellow-line {
    margin-bottom: 28px;
  }

  .news-grid {
    margin-left: 0;
    width: 100%;
    gap: 22px;
  }

  .news-card {
    width: 100%;
    grid-template-columns: 1fr;
    min-height: 0;
  }

  .news-card img {
    width: 100%;
    height: 240px;
    min-height: 0;
    object-fit: cover;
  }

  .news-content {
    padding: 24px 20px 30px;
  }

  .news-date {
    font-size: 14px;
    margin-bottom: 15px;
  }

  .news-card h2 {
    font-size: 22px;
    margin-bottom: 14px;
  }

  .news-card p {
    font-size: 15px;
    line-height: 1.7;
  }

}
  </style>

</head>

  <script>

const API_URL = "https://fenerbahce-marl-backend.onrender.com";

const newsContainer = document.getElementById("newsContainer");


async function loadNews() {

  try {

    const response = await fetch(
      API_URL + "/api/news"
    );

    const news = await response.json();


    if (!response.ok) {
      throw new Error("News konnten nicht geladen werden.");
    }


    if (news.length === 0) {

      newsContainer.innerHTML = `
        <div class="loading">
          Aktuell sind keine News vorhanden.
        </div>
      `;

      return;
    }


    newsContainer.innerHTML = "";


    news.forEach(item => {

      const date = new Date(item.created_at)
        .toLocaleDateString(
          "de-DE",
          {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }
        );


      const card = document.createElement("article");

      card.className = "news-card";


      card.innerHTML = `

        ${
          item.image_url
  ? `
      <img
        src="${item.image_url}"
        alt="${escapeHTML(item.title)}"
        style="
          object-position:
          ${item.image_position_x ?? 50}%
          ${item.image_position_y ?? 50}%;
        "
      >
    `
  : ""
        }

        <div class="news-content">

          <span class="news-date">
            ${date}
          </span>

          <h2>
            ${escapeHTML(item.title)}
          </h2>

          <p>
            ${escapeHTML(item.text)}
          </p>

        </div>
      `;


      newsContainer.appendChild(card);

    });


  } catch (error) {

  console.error(error);

  newsContainer.innerHTML = `
    <div class="loading">
      News werden geladen...
    </div>
  `;

  setTimeout(() => {
    loadNews();
  }, 5000);

}

}


function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


loadNews();

    const profileButton =
  document.getElementById("profileButton");

const profileDropdown =
  document.getElementById("profileDropdown");

const loginMenuItem =
  document.getElementById("loginMenuItem");

const newsMenuItem =
  document.getElementById("newsMenuItem");

const teamMenuItem =
  document.getElementById("teamMenuItem");

const logoutMenuItem =
  document.getElementById("logoutMenuItem");


profileButton.addEventListener("click", function(event) {

  event.stopPropagation();

  profileDropdown.classList.toggle("open");

});


document.addEventListener("click", function() {

  profileDropdown.classList.remove("open");

});


profileDropdown.addEventListener("click", function(event) {

  event.stopPropagation();

});


async function updateProfileMenu() {

  const token =
    sessionStorage.getItem("vorstandToken");


  if (!token) {

    loginMenuItem.style.display = "block";
newsMenuItem.style.display = "none";
teamMenuItem.style.display = "none";
logoutMenuItem.style.display = "none";

    return;
  }


  try {

    const response = await fetch(
      API_URL + "/api/auth/check",
      {
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );


    if (!response.ok) {

      sessionStorage.removeItem("vorstandToken");

      loginMenuItem.style.display = "block";
newsMenuItem.style.display = "none";
teamMenuItem.style.display = "none";
logoutMenuItem.style.display = "none";

      return;
    }


    loginMenuItem.style.display = "none";
newsMenuItem.style.display = "block";
teamMenuItem.style.display = "block";
logoutMenuItem.style.display = "block";


  } catch (error) {

    console.error(error);

  }

}


logoutMenuItem.addEventListener("click", function() {

  sessionStorage.removeItem("vorstandToken");

  profileDropdown.classList.remove("open");

  updateProfileMenu();

});


updateProfileMenu();

const mobileMenuButton =
  document.getElementById("mobileMenuButton");

const mainNav =
  document.querySelector(".main-nav");

mobileMenuButton.addEventListener("click", function() {
  mainNav.classList.toggle("open");
});


const mobileTeamMenu =
  document.querySelector(".team-menu");

const mobileTeamMenuLink =
  document.querySelector(".team-menu-link");

mobileTeamMenuLink.addEventListener("click", function(event) {

  if (window.innerWidth <= 900) {
    event.preventDefault();
    mobileTeamMenu.classList.toggle("mobile-open");
  }

});
    
</script>
