<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vorstand Dashboard | Fenerbahçe Marl</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f5f7;
      color: #111;
    }

    header {
  background: #071c4a;
  color: white;
  padding: 18px 7%;
  display: flex;
  align-items: center;
  position: relative;
}

.club-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.club-logo {
  width: 60px;
  height: 60px;
  object-fit: contain;
  display: block;
}

.club-logo-link {
  display: flex;
  align-items: center;
  text-decoration: none;
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
}

nav {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 25px;
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
}

nav a:hover {
  color: #ffd800;
}

    .logout-btn {
      background: #ffd800;
      color: #071c4a;
      border: none;
      padding: 11px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .dashboard {
      max-width: 1200px;
      margin: auto;
      padding: 50px 25px;
    }

    .dashboard h1 {
      color: #071c4a;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 40px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 6px 25px rgba(0,0,0,.08);
    }

    .box h2 {
      color: #071c4a;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #071c4a;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 7px;
      padding: 13px;
      font-size: 15px;
      margin-bottom: 20px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #071c4a;
    }

    .image-position-box {
  width: 100%;
  aspect-ratio: 725 / 350;
  height: auto;
  background: #eee;
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  display: none;
  position: relative;
  cursor: grab;
  user-select: none;
  touch-action: none;
}

.image-position-box:active {
  cursor: grabbing;
}

.image-preview {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 50%;
  display: block;
  pointer-events: none;
}

.image-position-help {
  display: none;
  color: #777;
  font-size: 13px;
  margin-bottom: 20px;
}

    .publish-btn {
      width: 100%;
      background: #071c4a;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 7px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .publish-btn:hover {
      background: #ffd800;
      color: #071c4a;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .news-item {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 18px;
    }

    .news-item h3 {
      color: #071c4a;
      margin-bottom: 7px;
    }

    .news-item p {
      color: #777;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .news-actions {
      display: flex;
      gap: 10px;
    }

    .edit-btn,
    .delete-btn {
      border: none;
      padding: 8px 13px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .edit-btn {
      background: #ffd800;
      color: #071c4a;
    }

    .delete-btn {
      background: #c62828;
      color: white;
    }

    .empty-news {
      color: #777;
      text-align: center;
      padding: 40px 10px;
    }

    @media(max-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      header {
        padding: 15px 20px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="club-brand">

  <a href="index.html" class="club-logo-link">
    <img
      src="logo.png"
      alt="Fenerbahçe Marl Logo"
      class="club-logo"
    >
  </a>

</div>

  <div class="header-right">

    <nav>
      <a href="index.html">Startseite</a>
      <a href="mannschaften.html">Mannschaften</a>
      <a href="news.html">News</a>
      <a href="sponsoren.html">Sponsoren</a>
      <a href="vorstand.html">Vorstand</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>

    <button
      class="logout-btn"
      id="logoutButton"
    >
      Abmelden
    </button>

  </div>

</header>


<main class="dashboard">

  <h1>News verwalten</h1>

  <p class="subtitle">
    Hier können Vereinsnews erstellt, bearbeitet und gelöscht werden.
  </p>


  <div class="dashboard-grid">


    <!-- NEUE NEWS -->

    <div class="box">

      <h2>Neue News erstellen</h2>

      <form id="newsForm">

        <label for="title">
          Überschrift
        </label>

        <input
          type="text"
          id="title"
          placeholder="z.B. Sieg im ersten Saisonspiel"
          required
        >


        <label for="image">
          Bild
        </label>

        <input
          type="file"
          id="image"
          accept="image/jpeg,image/png,image/webp"
          required
        >


        <div
  class="image-position-box"
  id="imagePositionBox"
>
  <img
    id="imagePreview"
    class="image-preview"
    alt="Vorschau"
  >
</div>

<div
  class="image-position-help"
  id="imagePositionHelp"
>
  Bild mit der Maus verschieben, bis der gewünschte Ausschnitt sichtbar ist.
</div>


        <label for="text">
          News-Text
        </label>

        <textarea
          id="text"
          placeholder="Schreibe hier die vollständige News..."
          required
        ></textarea>


        <button
          type="submit"
          class="publish-btn"
        >
          NEWS VERÖFFENTLICHEN
        </button>

      </form>

    </div>



    <!-- VORHANDENE NEWS -->

    <div class="box">

      <h2>Veröffentlichte News</h2>

      <div
        class="news-list"
        id="newsList"
      >

        <div class="empty-news">
          Noch keine News vorhanden.
        </div>

      </div>

    </div>


  </div>

</main>


<script>

const API_URL = "https://fenerbahce-marl-backend.onrender.com";

const token = sessionStorage.getItem("vorstandToken");

const newsForm = document.getElementById("newsForm");
const titleInput = document.getElementById("title");
const textInput = document.getElementById("text");
const imageInput = document.getElementById("image");
const imagePreview = document.getElementById("imagePreview");
const imagePositionBox = document.getElementById("imagePositionBox");
const imagePositionHelp = document.getElementById("imagePositionHelp");
const newsList = document.getElementById("newsList");
const logoutButton = document.getElementById("logoutButton");

let editingNewsId = null;
let currentImageUrl = null;
let imagePositionX = 50;
let imagePositionY = 50;

let isDraggingImage = false;
let dragStartX = 0;
let dragStartY = 0;
let dragStartPositionX = 50;
let dragStartPositionY = 50;


/* =========================================
   LOGIN PRÜFEN
========================================= */

async function checkLogin() {

  if (!token) {
    window.location.href = "vorstand-login.html";
    return;
  }

  try {

    const response = await fetch(
      API_URL + "/api/auth/check",
      {
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    if (!response.ok) {
      localStorage.removeItem("vorstandToken");
      window.location.href = "vorstand-login.html";
      return;
    }

    loadNews();

  } catch (error) {

    console.error(error);

    alert("Verbindung zum Server fehlgeschlagen.");

  }

}


/* =========================================
   BILD VORSCHAU + POSITIONIEREN
========================================= */

imageInput.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) {
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {

    imagePreview.src = event.target.result;

    imagePositionX = 50;
    imagePositionY = 50;

    updateImagePosition();

    imagePositionBox.style.display = "block";
    imagePositionHelp.style.display = "block";

  };

  reader.readAsDataURL(file);

});


function updateImagePosition() {

  imagePreview.style.objectPosition =
    imagePositionX + "% " + imagePositionY + "%";

}


imagePositionBox.addEventListener(
  "pointerdown",
  function(event) {

    isDraggingImage = true;

    dragStartX = event.clientX;
    dragStartY = event.clientY;

    dragStartPositionX = imagePositionX;
    dragStartPositionY = imagePositionY;

    imagePositionBox.setPointerCapture(
      event.pointerId
    );

  }
);


imagePositionBox.addEventListener(
  "pointermove",
  function(event) {

    if (!isDraggingImage) {
      return;
    }

    const rect =
      imagePositionBox.getBoundingClientRect();

    const moveX =
      event.clientX - dragStartX;

    const moveY =
      event.clientY - dragStartY;


    imagePositionX =
      dragStartPositionX -
      (moveX / rect.width) * 100;

    imagePositionY =
      dragStartPositionY -
      (moveY / rect.height) * 100;


    imagePositionX =
      Math.max(
        0,
        Math.min(100, imagePositionX)
      );

    imagePositionY =
      Math.max(
        0,
        Math.min(100, imagePositionY)
      );


    updateImagePosition();

  }
);


imagePositionBox.addEventListener(
  "pointerup",
  function() {

    isDraggingImage = false;

  }
);


imagePositionBox.addEventListener(
  "pointercancel",
  function() {

    isDraggingImage = false;

  }
);


/* =========================================
   BILD HOCHLADEN
========================================= */

async function uploadImage(file) {

  const formData = new FormData();

  formData.append("image", file);

  const response = await fetch(
    API_URL + "/api/upload",
    {
      method: "POST",

      headers: {
        Authorization: "Bearer " + token
      },

      body: formData
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.error || "Bild konnte nicht hochgeladen werden."
    );
  }

  return data.image_url;

}


/* =========================================
   NEWS VERÖFFENTLICHEN / BEARBEITEN
========================================= */

newsForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  const title = titleInput.value.trim();
  const text = textInput.value.trim();
  const file = imageInput.files[0];

  if (!title || !text) {
    alert("Bitte Überschrift und Text ausfüllen.");
    return;
  }

  if (!editingNewsId && !file) {
    alert("Bitte ein Bild auswählen.");
    return;
  }


  const publishButton =
    document.querySelector(".publish-btn");

  publishButton.disabled = true;
  publishButton.textContent = "BITTE WARTEN...";


  try {

    let imageUrl = currentImageUrl;


    /* Neues Bild hochladen */

    if (file) {
      imageUrl = await uploadImage(file);
    }


    /* Neue News */

    if (!editingNewsId) {

      const response = await fetch(
        API_URL + "/api/news",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },

          body: JSON.stringify({
  title: title,
  text: text,
  image_url: imageUrl,
  image_position_x: imagePositionX,
  image_position_y: imagePositionY
})
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "News konnte nicht veröffentlicht werden."
        );
      }

      alert("News wurde veröffentlicht.");

    }


    /* News bearbeiten */

    else {

      const response = await fetch(
        API_URL + "/api/news/" + editingNewsId,
        {
          method: "PUT",

          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },

          body: JSON.stringify({
  title: title,
  text: text,
  image_url: imageUrl,
  image_position_x: imagePositionX,
  image_position_y: imagePositionY
})
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "News konnte nicht bearbeitet werden."
        );
      }

      alert("News wurde gespeichert.");

    }


    resetForm();

    await loadNews();


  } catch (error) {

    console.error(error);

    alert(error.message);

  } finally {

    publishButton.disabled = false;

    publishButton.textContent =
      editingNewsId
        ? "ÄNDERUNGEN SPEICHERN"
        : "NEWS VERÖFFENTLICHEN";

  }

});


/* =========================================
   NEWS LADEN
========================================= */

async function loadNews() {

  try {

    const response = await fetch(
      API_URL + "/api/news"
    );

    const news = await response.json();

    if (!response.ok) {
      throw new Error(
        "News konnten nicht geladen werden."
      );
    }


    if (news.length === 0) {

      newsList.innerHTML = `
        <div class="empty-news">
          Noch keine News vorhanden.
        </div>
      `;

      return;
    }


    newsList.innerHTML = "";


    news.forEach(item => {

      const newsItem =
        document.createElement("div");

      newsItem.className = "news-item";


      const date =
        new Date(item.created_at)
        .toLocaleDateString(
          "de-DE",
          {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }
        );


      newsItem.innerHTML = `

        ${
          item.image_url
          ?
          `
          <img
  src="${item.image_url}"
  style="
    width:100%;
    height:150px;
    object-fit:cover;
    object-position:${item.image_position_x ?? 50}% ${item.image_position_y ?? 50}%;
    border-radius:7px;
    margin-bottom:15px;
  "
>
          `
          :
          ""
        }

        <h3>
          ${escapeHTML(item.title)}
        </h3>

        <p>
          ${date}
        </p>

        <div class="news-actions">

          <button
            class="edit-btn"
            onclick="editNews(${item.id})"
          >
            Bearbeiten
          </button>

          <button
            class="delete-btn"
            onclick="deleteNews(${item.id})"
          >
            Löschen
          </button>

        </div>

      `;


      newsList.appendChild(newsItem);

    });


  } catch (error) {

    console.error(error);

    newsList.innerHTML = `
      <div class="empty-news">
        News konnten nicht geladen werden.
      </div>
    `;

  }

}


/* =========================================
   NEWS BEARBEITEN
========================================= */

async function editNews(id) {

  try {

    const response = await fetch(
      API_URL + "/api/news/" + id
    );

    const item = await response.json();

    if (!response.ok) {
      throw new Error("News konnte nicht geladen werden.");
    }


    editingNewsId = item.id;
    currentImageUrl = item.image_url;


    titleInput.value = item.title;
    textInput.value = item.text;


    if (item.image_url) {

  imagePreview.src = item.image_url;

  imagePositionX =
    item.image_position_x ?? 50;

  imagePositionY =
    item.image_position_y ?? 50;

  updateImagePosition();

  imagePositionBox.style.display = "block";
  imagePositionHelp.style.display = "block";

}


    imageInput.required = false;


    document.querySelector(".publish-btn")
      .textContent = "ÄNDERUNGEN SPEICHERN";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });


  } catch (error) {

    console.error(error);

    alert(error.message);

  }

}


/* =========================================
   NEWS LÖSCHEN
========================================= */

async function deleteNews(id) {

  const confirmed =
    confirm("Möchtest du diese News wirklich löschen?");

  if (!confirmed) {
    return;
  }


  try {

    const response = await fetch(
      API_URL + "/api/news/" + id,
      {
        method: "DELETE",

        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "News konnte nicht gelöscht werden."
      );
    }


    alert("News wurde gelöscht.");

    loadNews();


  } catch (error) {

    console.error(error);

    alert(error.message);

  }

}


/* =========================================
   FORMULAR ZURÜCKSETZEN
========================================= */

function resetForm() {

  newsForm.reset();

  editingNewsId = null;
  currentImageUrl = null;

  imagePreview.src = "";

imagePositionBox.style.display = "none";
imagePositionHelp.style.display = "none";

imagePositionX = 50;
imagePositionY = 50;

updateImagePosition();

  imageInput.required = true;

  document.querySelector(".publish-btn")
    .textContent = "NEWS VERÖFFENTLICHEN";

}


/* =========================================
   TEXT SICHER AUSGEBEN
========================================= */

function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* =========================================
   ABMELDEN
========================================= */

logoutButton.addEventListener("click", function() {

  sessionStorage.removeItem("vorstandToken");

  window.location.href =
    "vorstand-login.html";

});


/* =========================================
   START
========================================= */

checkLogin();

</script>

</body>
</html>
