name: Update youth teams

on:
  push:
    paths:
      - ".github/workflows/update-youth.yml"

permissions:
  contents: write

jobs:
  update-youth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update youth pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          trainers = {
              "g-jugend.html": "Adem Aydemir & Yasir Arlat",
              "f-jugend.html": "Erhan Keskin & Senol Nurel",
              "e1-jugend.html": "Ertugrul Salbas & Okan Kaya",
              "e2-jugend.html": "Erdal Biyikli & Ibrahim Gürbüz",
              "d1-jugend.html": "Mustafa Yilmaz / Mehmet Keser / Semirhan Keser",
              "d2-jugend.html": "Andre Münch / Marvin Dietrich / Sascha Perisgehl",
          }

          def update_trainer_page(path_str, trainer_name):
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")

              text, count = re.subn(
                  r'(<div class="trainer-name">\s*)(.*?)(\s*</div>)',
                  lambda m: m.group(1) + trainer_name + m.group(3),
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise RuntimeError(f"Trainername konnte in {path_str} nicht ersetzt werden")

              text, count = re.subn(
                  r'\s*<div class="trainer-contact">\s*.*?\s*</div>',
                  '',
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise RuntimeError(f"Kontaktdaten konnten in {path_str} nicht entfernt werden")

              text = re.sub(
                  r'(\.trainer-name\s*\{.*?margin-bottom:\s*)22px;',
                  r'\g<1>0;',
                  text,
                  count=1,
                  flags=re.S,
              )

              path.write_text(text, encoding="utf-8")

          for filename, trainer in trainers.items():
              update_trainer_page(filename, trainer)

          # Bambini-Seite auf Basis der bestehenden G-Jugend-Seite erstellen.
          bambini = Path("g-jugend.html").read_text(encoding="utf-8")
          bambini = bambini.replace(
              "<title>G-Jugend | Fenerbahçe Marl</title>",
              "<title>Bambinis | Fenerbahçe Marl</title>",
              1,
          )
          bambini, count = re.subn(
              r'<h1 class="hero-title">\s*G\s*<span>Jugend</span>\s*</h1>',
              '<h1 class="hero-title">\n  Bambinis\n  <span>Ballgewöhnung</span>\n</h1>',
              bambini,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("Bambini-Überschrift konnte nicht erstellt werden")

          bambini = bambini.replace(
              "Trainer G-Jugend",
              "Trainer Bambinis (Ballgewöhnung)",
              1,
          )
          bambini = bambini.replace(
              "Adem Aydemir & Yasir Arlat",
              "Cengiz",
              1,
          )
          bambini = bambini.replace(
              "</style>",
              "\n@media(min-width: 901px) {\n  .hero-title {\n    font-size: clamp(56px, 5vw, 84px);\n  }\n}\n</style>",
              1,
          )
          Path("bambini-jugend.html").write_text(bambini, encoding="utf-8")

          # Bambinis links vor der G-Jugend auf der Jugendübersicht ergänzen.
          overview_path = Path("jugend.html")
          overview = overview_path.read_text(encoding="utf-8")

          overview = overview.replace(
              "grid-template-columns: repeat(6, 1fr);",
              "grid-template-columns: repeat(7, 1fr);",
              1,
          )

          if 'href="bambini-jugend.html"' not in overview:
              first_card = '<div class="youth-team-card">'
              position = overview.find(first_card)
              if position == -1:
                  raise RuntimeError("Erste Jugendkarte wurde nicht gefunden")

              bambini_card = '''<div class="youth-team-card">
    <svg class="shirt-icon" viewBox="0 0 64 56">
      <path d="M18 5l8-4h12l8 4 13 8-8 13-7-4v29H20V22l-7 4-8-13 13-8z" fill="currentColor"/>
    </svg>
    <div class="team-code">B</div>
    <div class="team-label">Bambinis</div>
    <a href="bambini-jugend.html" class="team-more-link">
      Mehr Informationen →
    </a>
  </div>

  '''
              overview = overview[:position] + bambini_card + overview[position:]

          overview_path.write_text(overview, encoding="utf-8")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jugend.html g-jugend.html f-jugend.html e1-jugend.html e2-jugend.html d1-jugend.html d2-jugend.html bambini-jugend.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Bambinis and update youth trainers"
            git push
          fi
