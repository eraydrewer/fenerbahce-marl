    body {

    .club-logo-link {

    nav {

    nav a {

    nav a:hover {

    .header-right {

.header-icons {

.icon-link,

.icon-link,

  height: 25px;

}

.profile-button svg {

  height: 27px;
  display: block;
}

.profile-menu-wrapper {
  position: relative;
}

.profile-dropdown {
  position: absolute;
  top: calc(100% + 12px);
  right: 0;
  width: 190px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
  overflow: hidden;
  display: none;
  z-index: 6000;
}

.profile-dropdown.show {
  display: block;
}

.profile-dropdown a,
.profile-dropdown button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 16px 18px;
  background: white;
  border: none;
  text-decoration: none;
  color: #071c4a;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.profile-dropdown a:hover,
.profile-dropdown button:hover {
  background: #f5f7fb;
}

.logout-menu-item {

}

    .team-menu {

}

.team-menu-link {
  display: flex;
  align-items: center;
  gap: 7px;
}

.menu-arrow {
  font-size: 9px;
}

.team-submenu {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  width: 205px;
  background: #071c4a;
  border-top: 3px solid #ffd800;
  border-radius: 0 0 8px 8px;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  z-index: 5000;
}

.team-menu:hover .team-submenu {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.team-submenu a {
  display: block;
  padding: 14px 18px;
  color: white;
  text-decoration: none;
}

.team-submenu a:hover {
  background: #173d7e;
  color: #ffd800;
}

    .header-right {

<script>

const API_URL =
  "https://fenerbahce-marl-backend.onrender.com";

const token =
  sessionStorage.getItem("vorstandToken");

let currentTeam =
  "erste-mannschaft";

const playersContainer =
  document.getElementById("playersContainer");

const teamImagePreview =
  document.getElementById("teamImagePreview");

const teamImageInput =
  document.getElementById("teamImageInput");

const teamTitle =
  document.getElementById("teamTitle");

const imageStatus =
  document.getElementById("imageStatus");

const playerStatus =
  document.getElementById("playerStatus");


/* =========================================
   LOGIN PRÜFEN
========================================= */

async function checkLogin() {

  if (!token) {

    window.location.href =
      "vorstand-login.html";

    return;

  }

  try {

    const response = await fetch(
      API_URL + "/api/auth/check",
      {
        headers: {
          Authorization:
            "Bearer " + token
        }
      }
    );


    if (!response.ok) {

      sessionStorage.removeItem(
        "vorstandToken"
      );

      window.location.href =
        "vorstand-login.html";

      return;

    }


    loadTeam();


  } catch (error) {

    console.error(error);

    alert(
      "Verbindung zum Server fehlgeschlagen."
    );

  }

}

  /* =========================================
   MANNSCHAFT LADEN
========================================= */

async function loadTeam() {

  playerStatus.textContent =
    "Mannschaft wird geladen...";

  try {

    const response = await fetch(
      API_URL +
      "/api/teams/" +
      currentTeam
    );

    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Mannschaft konnte nicht geladen werden."
      );

    }


    teamTitle.textContent =
      data.name + " – Mannschaftsbild";


    if (data.image_url) {

      teamImagePreview.src =
        data.image_url;

    } else {

      teamImagePreview.src =
        "team.jpg";

    }


    playersContainer.innerHTML = "";


    data.players.forEach(player => {

      createPlayerRow(player);

    });


    playerStatus.textContent = "";


  } catch (error) {

    console.error(error);

    playerStatus.textContent =
      error.message;

  }

}

/* =========================================
   SPIELERZEILE
========================================= */

function createPlayerRow(player = {}) {

  const row =
    document.createElement("div");

  row.className =
    "player-row";


  row.innerHTML = `
    <input
      type="text"
      class="shirt-number"
      placeholder="Nr."
      value="${escapeHtml(player.shirt_number || "")}"
    >

    <input
      type="text"
      class="player-name"
      placeholder="Spielername"
      value="${escapeHtml(player.name || "")}"
    >

    <select class="position-group">

  <option value="">
    Position wählen
  </option>

  <option value="Torwart">
    Torwart
  </option>

  <option value="Abwehr">
    Abwehr
  </option>

  <option value="Mittelfeld">
    Mittelfeld
  </option>

  <option value="Sturm">
    Sturm
  </option>

</select>

    <button
      type="button"
      class="delete-player"
      title="Spieler löschen"
    >
      ×
    </button>
  `;


  const select =
    row.querySelector(
      ".position-group"
    );

  select.value =
    player.position_group || "";


  row
    .querySelector(".delete-player")
    .addEventListener(
      "click",
      function() {

        row.remove();

      }
    );


  playersContainer.appendChild(row);

}


/* =========================================
   SPIELER HINZUFÜGEN
========================================= */

document

document
  .getElementById("savePlayersButton")

    "click",
    async function() {

      const rows =
        document.querySelectorAll(
          ".player-row"

      const players =
        Array.from(rows)
          .map(row => {

            return {

                row
                  .querySelector(

                  )
                  .value
                  .trim(),

                  .querySelector(
                    ".player-name"
                  )
                  .value
                  .trim(),

              position_group:
  row
    .querySelector(
      ".position-group"
    )
    .value,

position: ""

            };

          })
          .filter(player =>
            player.name
          );


      playerStatus.textContent =
        "Wird gespeichert...";


      try {

        const response = await fetch(
          API_URL +
          "/api/teams/" +
          currentTeam +
          "/players",
          {
            method: "PUT",

            headers: {
              "Content-Type":
                "application/json",

              Authorization:
                "Bearer " + token
            },

            body: JSON.stringify({
              players: players
            })
          }
        );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Spieler konnten nicht gespeichert werden."
          );

        }


        playerStatus.textContent =
          "Änderungen wurden gespeichert.";


        loadTeam();


      } catch (error) {

        console.error(error);

        playerStatus.textContent =
          error.message;

      }

    }
  );


/* =========================================
   MANNSCHAFTSBILD VORSCHAU
========================================= */

teamImageInput.addEventListener(
  "change",
  function() {

    const file =
      this.files[0];

    if (!file) {
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        teamImagePreview.src =
          event.target.result;

      };


    reader.readAsDataURL(file);

  }
);


/* =========================================
   MANNSCHAFTSBILD SPEICHERN
========================================= */

document
  .getElementById("uploadImageButton")
  .addEventListener(
    "click",
    async function() {

      const file =
        teamImageInput.files[0];


      if (!file) {

        imageStatus.textContent =
          "Bitte zuerst ein Bild auswählen.";

        return;

      }


      imageStatus.textContent =
        "Bild wird hochgeladen...";


      try {

        const formData =
          new FormData();

        formData.append(
          "image",
          file
        );


        const response =
          await fetch(
            API_URL +
            "/api/teams/" +
            currentTeam +
            "/image",
            {
              method: "POST",

              headers: {
                Authorization:
                  "Bearer " + token
              },

              body: formData
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Bild konnte nicht gespeichert werden."
          );

        }


        teamImagePreview.src =
          data.image_url;


        teamImageInput.value = "";


        imageStatus.textContent =
          "Mannschaftsbild wurde gespeichert.";


      } catch (error) {

        console.error(error);

        imageStatus.textContent =
          error.message;

      }

    }
  );


/* =========================================
   MANNSCHAFT WECHSELN
========================================= */

document
  .querySelectorAll(".team-tab[data-team]")
  .forEach(button => {

    button.addEventListener(
      "click",
      function() {

        currentTeam =
          this.dataset.team;


        document
          .querySelectorAll(".team-tab")
          .forEach(tab => {

            tab.classList.remove(
              "active"
            );

          });


        this.classList.add(
          "active"
        );


        teamImageInput.value = "";

        imageStatus.textContent = "";

        playerStatus.textContent = "";


        loadTeam();

      }
    );

  });

const profileButton =

const profileDropdown =

const logoutMenuItem =
  document.getElementById("logoutMenuItem");


profileButton.addEventListener(

);

);

========================================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

  /* =========================================
   SPONSOREN LADEN
========================================= */

async function loadSponsors() {

  const sponsorList =
    document.getElementById("sponsorList");

  sponsorList.textContent =
    "Sponsoren werden geladen...";

  try {

    const response = await fetch(
      API_URL + "/api/sponsors"
    );

    const sponsors =
      await response.json();

    if (!response.ok) {

      throw new Error(
        sponsors.error ||
        "Sponsoren konnten nicht geladen werden."
      );
    }


    if (sponsors.length === 0) {

      sponsorList.textContent =
        "Noch keine Sponsoren vorhanden.";

      return;
    }


    sponsorList.innerHTML = "";


    sponsors.forEach(sponsor => {

      const item =
        document.createElement("div");

      item.style.display = "flex";
      item.style.alignItems = "center";
      item.style.gap = "20px";
      item.style.padding = "15px";
      item.style.marginBottom = "12px";
      item.style.background = "#f7f8fa";
      item.style.borderRadius = "8px";


      const image =
        document.createElement("img");

      image.src = sponsor.image_url;
      image.alt = sponsor.name;

      image.style.width = "100px";
      image.style.height = "70px";
      image.style.objectFit = "contain";


      const name =
  document.createElement("strong");

name.textContent =
  sponsor.name;


/* LÖSCHEN BUTTON */

const deleteButton =
  document.createElement("button");

deleteButton.textContent =
  "Löschen";

deleteButton.style.marginLeft = "auto";
deleteButton.style.background = "#c62828";
deleteButton.style.color = "white";
deleteButton.style.border = "none";
deleteButton.style.padding = "10px 18px";
deleteButton.style.borderRadius = "6px";
deleteButton.style.fontWeight = "bold";
deleteButton.style.cursor = "pointer";


deleteButton.addEventListener(
  "click",
  async function() {

    const confirmed = confirm(
      `"${sponsor.name}" wirklich löschen?`
    );

    if (!confirmed) {
      return;
    }


    try {

      deleteButton.disabled = true;
      deleteButton.textContent =
        "Wird gelöscht...";


      const response = await fetch(
        API_URL +
        "/api/sponsors/" +
        sponsor.id,
        {
          method: "DELETE",

          headers: {
            Authorization:
              "Bearer " + token
          }
        }
      );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Sponsor konnte nicht gelöscht werden."
        );

      }


      await loadSponsors();


    } catch (error) {

      console.error(error);

      alert(error.message);

      deleteButton.disabled = false;
      deleteButton.textContent =
        "Löschen";

    }

  }
);


item.appendChild(image);
item.appendChild(name);
item.appendChild(deleteButton);

sponsorList.appendChild(item);

    });


  } catch (error) {

    console.error(error);

    sponsorList.textContent =
      error.message;

  }

}

/* =========================================
   SPONSOR HINZUFÜGEN
========================================= */

document
  .getElementById("addSponsorButton")
  .addEventListener("click", async function() {

    const sponsorName =
      document
        .getElementById("sponsorName")
        .value
        .trim();

    const sponsorImage =
      document
        .getElementById("sponsorImage")
        .files[0];

    const sponsorStatus =
      document.getElementById("sponsorStatus");


    if (!sponsorName) {

      sponsorStatus.textContent =
        "Bitte Sponsorname eingeben.";

      return;
    }


    if (!sponsorImage) {

      sponsorStatus.textContent =
        "Bitte Sponsor-Logo auswählen.";

      return;
    }


    sponsorStatus.textContent =
      "Sponsor wird gespeichert...";


    try {

      const formData =
        new FormData();

      formData.append(
        "name",
        sponsorName
      );

      formData.append(
        "image",
        sponsorImage
      );


      const response = await fetch(
        API_URL + "/api/sponsors",
        {
          method: "POST",

          headers: {
            Authorization:
              "Bearer " + token
          },

          body: formData
        }
      );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Sponsor konnte nicht gespeichert werden."
        );
      }


      sponsorStatus.textContent =
        "Sponsor wurde hinzugefügt.";

      document
        .getElementById("sponsorName")
        .value = "";

      document
        .getElementById("sponsorImage")
        .value = "";

      await loadSponsors();

    } catch (error) {

      console.error(error);

      sponsorStatus.textContent =
        error.message;
    }

  });
