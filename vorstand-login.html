<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/logo.png">

  <title>Vorstand Login | Fenerbahçe Marl</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f3f4f7;
      color: #111;
    }

    header {
  background: #071c4a;
  color: white;
  padding: 18px 7%;
  display: flex;
  align-items: center;
  position: relative;
}

    .club-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.club-logo {
  width: 60px;
  height: 60px;
  object-fit: contain;
  display: block;
}

.club-logo-link {
  display: flex;
  align-items: center;
  text-decoration: none;
}

nav {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 30px;
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: 600;
}

nav a:hover {
  color: #ffd800;
}

    /* MANNSCHAFTEN DROPDOWN */

.team-menu {
  position: relative;
}

.team-menu-link {
  display: flex;
  align-items: center;
  gap: 7px;
}

.menu-arrow {
  font-size: 9px;
  transition: transform 0.2s ease;
}

.team-menu:hover .menu-arrow {
  transform: rotate(180deg);
}

.team-submenu {
  position: absolute;
  top: calc(100% + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(-5px);
  width: 205px;
  background: #071c4a;
  border-top: 3px solid #ffd800;
  border-radius: 0 0 8px 8px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition:
    opacity 0.2s ease,
    transform 0.2s ease,
    visibility 0.2s ease;
  z-index: 5000;
}

.team-submenu::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -15px;
  height: 15px;
}

.team-menu:hover .team-submenu {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}

.team-submenu a {
  display: block;
  padding: 14px 18px;
  color: white;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.team-submenu a:last-child {
  border-bottom: none;
}

.team-submenu a:hover {
  background: #173d7e;
  color: #ffd800;
}

    .login-page {
      min-height: calc(100vh - 130px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 45px;
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
    }

    .login-box h1 {
      text-align: center;
      color: #071c4a;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .login-box p {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .yellow-line {
      width: 55px;
      height: 5px;
      background: #ffd800;
      margin: 15px auto 30px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #071c4a;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
    }

    input:focus {
      border-color: #071c4a;
    }

    button {
      width: 100%;
      border: none;
      background: #071c4a;
      color: white;
      padding: 15px;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffd800;
      color: #071c4a;
    }

    .error-message {
      display: none;
      background: #ffe5e5;
      color: #b00020;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #071c4a;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .mobile-menu-button {
  display: none;
  width: 36px;
  height: 32px;
  background: transparent;
  border: none;
  cursor: pointer;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  padding: 4px;
  flex-shrink: 0;
}

.mobile-menu-button span {
  display: block;
  width: 100%;
  height: 3px;
  background: white;
  border-radius: 5px;
}

.mobile-menu-button:hover {
  background: transparent;
}

    @media(max-width: 800px) {

  header {
    padding: 12px 18px;
    flex-direction: row;
    gap: 0;
    min-height: 74px;
    z-index: 5000;
  }

  .club-logo {
    width: 50px;
    height: 50px;
  }

  .club-brand {
    order: 1;
  }

  .mobile-menu-button {
    display: flex;
    order: 2;
    margin-left: auto;
  }

  nav {
    display: none;
    position: absolute;
    top: 74px;
    left: 0;
    transform: none;
    width: 100%;
    background: #071c4a;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 10px 18px 20px;
    border-top: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 10px 20px rgba(0,0,0,.18);
  }

  nav.open {
    display: flex;
  }

  nav > a,
  .team-menu-link {
    width: 100%;
    padding: 14px 5px;
    font-size: 15px;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }

  .team-menu {
    width: 100%;
  }

  .team-menu-link {
    justify-content: space-between;
  }

  .team-submenu {
    display: none;
    position: static;
    left: auto;
    width: 100%;
    transform: none;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    box-shadow: none;
    border: none;
    border-radius: 0;
    background: #0b2a65;
    margin: 0;
  }

  .team-menu.mobile-open .team-submenu,
  .team-menu:hover .team-submenu {
    display: block;
    position: static;
    left: auto;
    transform: none;
    width: 100%;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .team-menu.mobile-open .menu-arrow {
    transform: rotate(180deg);
  }

  .team-submenu a {
    display: block;
    width: 100%;
    padding: 14px 20px;
    font-size: 14px;
    color: white;
    text-align: left;
  }


  /* LOGIN HANDY */

  .login-page {
    min-height: calc(100vh - 74px);
    padding: 35px 18px;
  }

  .login-box {
    max-width: 100%;
    padding: 30px 22px;
    border-radius: 12px;
  }

  .login-box h1 {
    font-size: 28px;
  }

  .login-box p {
    font-size: 14px;
    line-height: 1.5;
  }

  input {
    font-size: 16px;
    min-height: 48px;
  }

  #loginForm button {
    min-height: 48px;
  }

}
  </style>
</head>

<body>

<header>

  <div class="club-brand">

  <a href="index.html" class="club-logo-link">
    <img
      src="logo.png"
      alt="Fenerbahçe Marl Logo"
      class="club-logo"
    >
  </a>

</div>

  <button
  class="mobile-menu-button"
  id="mobileMenuButton"
  type="button"
  aria-label="Menü öffnen"
>
  <span></span>
  <span></span>
  <span></span>
</button>

  <nav>
    <a href="index.html">Startseite</a>
    <div class="team-menu">

  <a
    href="erste-mannschaft.html"
    class="team-menu-link"
  >
    Mannschaften
    <span class="menu-arrow">▼</span>
  </a>

  <div class="team-submenu">

    <a href="erste-mannschaft.html">
      1. Mannschaft
    </a>

    <a href="zweite-mannschaft.html">
      2. Mannschaft
    </a>

    <a href="dritte-mannschaft.html">
      3. Mannschaft
    </a>

  </div>

</div>
    <a href="jugend.html">Jugend</a>
    <a href="news.html">News</a>
    <a href="sponsoren.html">Sponsoren</a>
    <a href="vorstand.html">Vorstand</a>
    <a href="kontakt.html">Kontakt</a>
  </nav>

</header>


<main class="login-page">

  <div class="login-box">

    <h1>Vorstand</h1>

    <div class="yellow-line"></div>

    <p>
      Anmeldung zum Verwaltungsbereich
    </p>


    <div class="error-message" id="errorMessage">
      Benutzername oder Passwort ist falsch.
    </div>


    <form id="loginForm">

      <label for="username">
        Benutzername
      </label>

      <input
        type="text"
        id="username"
        placeholder="Benutzername"
        required
      >


      <label for="password">
        Passwort
      </label>

      <input
        type="password"
        id="password"
        placeholder="Passwort"
        required
      >


      <button type="submit">
        ANMELDEN
      </button>

    </form>


    <a href="index.html" class="back-link">
      ← Zurück zur Startseite
    </a>

  </div>

</main>


<script>
  
const API_URL = "https://fenerbahce-marl-backend.onrender.com";

document
  .getElementById("loginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value;

    const errorMessage =
      document.getElementById("errorMessage");

    errorMessage.style.display = "none";


    try {

      const response = await fetch(
        API_URL + "/api/login",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            username: username,
            password: password
          })
        }
      );


      const data = await response.json();


      if (!response.ok) {

        errorMessage.textContent =
          data.error || "Benutzername oder Passwort ist falsch.";

        errorMessage.style.display = "block";

        return;
      }


     sessionStorage.setItem(
  "vorstandToken",
  data.token
);


      window.location.href =
        "vorstand-dashboard.html";


    } catch (error) {

      console.error(error);

      errorMessage.textContent =
        "Verbindung zum Server fehlgeschlagen.";

      errorMessage.style.display = "block";

    }

  });

  const mobileMenuButton =
  document.getElementById("mobileMenuButton");

const mainNav =
  document.querySelector("nav");

mobileMenuButton.addEventListener("click", function() {
  mainNav.classList.toggle("open");
});


const mobileTeamMenu =
  document.querySelector(".team-menu");

const mobileTeamMenuLink =
  document.querySelector(".team-menu-link");

mobileTeamMenuLink.addEventListener("click", function(event) {

  if (window.innerWidth <= 800) {
    event.preventDefault();
    mobileTeamMenu.classList.toggle("mobile-open");
  }

});

</script>

</body>
</html>
