<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Impressum | Fenerbahçe Marl</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
  background: #f4f5f7;
  color: #111;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}


    /* HEADER */

    header {
      background: #071c4a;
      color: white;
      padding: 18px 7%;
      display: flex;
      align-items: center;
      position: relative;
    }

    .club-logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      display: block;
    }

    .club-logo-link {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .main-nav {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .main-nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }

    .main-nav a:hover {
      color: #ffd800;
    }


    /* IMPRESSUM */

.impressum-section {
  max-width: 1100px;
  margin: 0 auto;
  padding: 55px 25px 90px;
  flex: 1;
}

.impressum-title {
  text-align: center;
  color: #071c4a;
  font-size: 36px;
  text-transform: uppercase;
  margin-bottom: 70px;
}

.impressum-layout {
  display: grid;
  grid-template-columns: 400px 1fr;
  gap: 70px;
  align-items: center;
}

.impressum-logo-area {
  display: flex;
  justify-content: center;
  align-items: center;
}

.impressum-logo {
  width: 330px;
  height: 330px;
  object-fit: contain;
  display: block;
}

.impressum-content {
  color: #333;
}

.impressum-content p {
  font-size: 17px;
  line-height: 1.65;
  margin-bottom: 28px;
}

.impressum-content strong {
  color: #071c4a;
}

.impressum-content h2 {
  color: #071c4a;
  font-size: 25px;
  margin: 30px 0 12px;
}

@media(max-width: 800px) {

  .impressum-title {
    margin-bottom: 40px;
  }

  .impressum-layout {
    grid-template-columns: 1fr;
    gap: 35px;
  }

  .impressum-logo {
    width: 230px;
    height: 230px;
  }

  .impressum-content {
    text-align: center;
  }

}


    /* FOOTER */

footer {
  background: #071c4a;
  color: white;
  min-height: 105px;
  padding: 14px 7%;
  position: relative;
  display: flex;
  align-items: center;
}

.footer-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.footer-logo {
  width: 65px;
  height: 65px;
  object-fit: contain;
  display: block;
}

.footer-links {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}

.footer-link {
  color: rgba(255, 255, 255, 0.65);
  text-decoration: none;
  font-family: "Montserrat", sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.3px;
  padding-bottom: 3px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.45);
}

.footer-link:hover {
  color: #ffd800;
  border-color: #ffd800;
}

.footer-copy {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: "Montserrat", sans-serif;
  font-size: 10px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.55);
}

@media(max-width: 700px) {

  footer {
    flex-direction: column;
    justify-content: center;
    gap: 15px;
  }

  .footer-copy {
    position: static;
    transform: none;
  }

}


    /* HANDY */

    @media(max-width: 800px) {

      header {
        flex-direction: column;
        gap: 18px;
      }

      .main-nav {
        position: static;
        transform: none;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
      }

      .impressum-box {
        padding: 30px 22px;
      }

      }

  </style>

</head>


<body>


<header>

  <a href="index.html" class="club-logo-link">
    <img
      src="logo.png"
      alt="Fenerbahçe Marl Logo"
      class="club-logo"
    >
  </a>


  <nav class="main-nav">

    <a href="index.html">Startseite</a>
    <a href="mannschaften.html">Mannschaften</a>
    <a href="news.html">News</a>
    <a href="sponsoren.html">Sponsoren</a>
    <a href="vorstand.html">Vorstand</a>
    <a href="kontakt.html">Kontakt</a>

  </nav>

</header>


<main class="impressum-section">

  <h1 class="impressum-title">
    Impressum
  </h1>


  <div class="impressum-layout">

    <div class="impressum-logo-area">

      <img
        src="logo.png"
        alt="Fenerbahce Marl e.V. Wappen"
        class="impressum-logo"
      >

    </div>


    <div class="impressum-content">

      <p>
        Fenerbahce Marl e.V.<br>
        Bachackerweg 195<br>
        45772 Marl
      </p>


      <p>
        Vereinsregister: VR 1121<br>
        Registergericht: Gelsenkirchen
      </p>


      <p>
        <strong>Geschäftsführer:</strong><br>
        Ertugrul Salbas
      </p>

    </div>

  </div>

</main>


<footer>

  <div class="footer-left">

    <img
      src="logo.png"
      alt="Fenerbahçe Marl"
      class="footer-logo"
    >

    <div class="footer-links">

      <a href="impressum.html" class="footer-link">
        Impressum
      </a>

      <a href="datenschutz.html" class="footer-link">
        Datenschutz
      </a>

    </div>

  </div>

  <div class="footer-copy">
    © 2026 Fenerbahçe Marl – Alle Rechte vorbehalten
  </div>

</footer>


</body>
</html>
